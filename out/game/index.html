<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Iron Vanguard: Neon Defense</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #05070f;
        --ink: #eaf6ff;
        --muted: #8fa8c9;
        --accent: #5ff2ff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: radial-gradient(120% 120% at 50% 0%, #0b1226 0%, var(--bg) 62%, #01020a 100%);
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 12px;
        min-height: 100%;
      }
      #game {
        display: block;
        background: #04060d;
        border: 1px solid rgba(95, 242, 255, 0.35);
        border-radius: 10px;
        box-shadow: 0 0 0 1px rgba(6, 12, 24, 0.9), 0 24px 70px rgba(0, 0, 0, 0.75),
          0 0 42px rgba(95, 242, 255, 0.14);
        touch-action: none;
        outline: none;
      }
      #status {
        margin: 0;
        max-width: 1280px;
        min-height: 1.2em;
        font-size: 13px;
        letter-spacing: 0.02em;
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="1280" height="720" aria-label="Iron Vanguard: Neon Defense playfield"></canvas>
    <p id="status" role="status" aria-live="polite">
      Iron Vanguard: Neon Defense — press Space to begin.
    </p>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
